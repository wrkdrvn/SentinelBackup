{# Bootstrap-Modal-Fragment, wird von HTMX geladen. #}
<div class="modal fade" id="serverModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form hx-post="/api/servers"
                  hx-target="#servers-table"
                  hx-swap="innerHTML"
                  data-bs-dismiss="modal-on-success">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Server hinzufuegen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Hostname *</label>
                            <input type="text" name="hostname" class="form-control" required
                                   placeholder="mail01.example.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">IP-Adresse *</label>
                            <input type="text" name="ip" class="form-control" required
                                   placeholder="10.0.0.21">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">SSH-User</label>
                            <input type="text" name="ssh_user" class="form-control" value="root">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Servertyp</label>
                            <select name="server_type" class="form-select">
                                <option value="mailcow">MailCow</option>
                                <option value="ispconfig">ISPConfig</option>
                                <option value="docker" selected>Docker</option>
                                <option value="proxmox">Proxmox</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Backup-Pfad (Ziel)</label>
                            <input type="text" name="backup_path" class="form-control"
                                   placeholder="/mnt/backups/mail01">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Flag-Pfad (Quelle)</label>
                            <input type="text" name="flag_path" class="form-control"
                                   value="/var/run/backup_done">
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="active" id="chActive" checked>
                                <label class="form-check-label" for="chActive">Aktiv</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Speichern
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
