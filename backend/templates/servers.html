{% extends "base.html" %}
{% set active_page = "Server" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-server me-2"></i>Server</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#serverModal">
        <i class="bi bi-plus-circle me-1"></i>Hinzufuegen
    </button>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Hostname</th>
                    <th>IP</th>
                    <th>SSH-User</th>
                    <th>Typ</th>
                    <th>Status</th>
                    <th class="text-end">Aktionen</th>
                </tr>
            </thead>
            <!-- HTMX-Ziel: Tabellen-Body wird hier reingeswappt -->
            <tbody id="server-table-body">
                {% include "partials/server_rows.html" %}
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap Modal: Server hinzufuegen -->
<div class="modal fade" id="serverModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form hx-post="/servers/add"
                  hx-target="#server-table-body"
                  hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful) bootstrap.Modal.getInstance(document.getElementById('serverModal')).hide();">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Server hinzufuegen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                {% include "partials/server_modal_form.html" %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
